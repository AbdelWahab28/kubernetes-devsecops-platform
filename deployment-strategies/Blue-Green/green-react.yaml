apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-insi-m2-green
  namespace: default
  labels:
    app: react
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
      version: green
  template:
    metadata:
      labels:
        app: react
        version: green
    spec:
      imagePullSecrets:
      - name: gitlab-registry-secret
      containers:
      - name: react
        image: registry.gitlab.com/projet_insi/app-testcluster/reactapp:green-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://laravel-service:8080"
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
