# ============================================================
# 🔎 VERIFY — Vérification structure projet
# ============================================================

verify_structure:
  stage: verify
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "green"
  script:
    - echo "🔹 Vérification structure projet..."
    - test -d apps/frontend            || (echo "❌ apps/frontend manquant"          && exit 1)
    - test -d apps/backend             || (echo "❌ apps/backend manquant"           && exit 1)
    - test -d k8s                      || (echo "❌ dossier k8s manquant"            && exit 1)
    - test -f apps/frontend/Dockerfile || (echo "❌ Dockerfile frontend manquant"   && exit 1)
    - test -f apps/backend/Dockerfile  || (echo "❌ Dockerfile backend manquant"    && exit 1)
    - test -f ci/frontend.yml          || (echo "❌ ci/frontend.yml manquant"        && exit 1)
    - test -f ci/backend.yml           || (echo "❌ ci/backend.yml manquant"         && exit 1)
    - test -f ci/security.yml          || (echo "❌ ci/security.yml manquant"        && exit 1)
    - test -f ci/deploy.yml            || (echo "❌ ci/deploy.yml manquant"          && exit 1)
    - test -f docker-compose.yml       || (echo "❌ docker-compose.yml manquant"     && exit 1)
    - echo "✅ Structure projet valide"
