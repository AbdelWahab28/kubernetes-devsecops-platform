# ============================================================
# 💼 BACKUPS — CronJob backup MySQL
# Ne se déploie QUE si les fichiers backups changent
# ============================================================

.kube_setup: &kube_setup
  - mkdir -p /tmp/kube
  - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kube.yaml
  - export KUBECONFIG=/tmp/kube.yaml
  - kubectl get nodes

deploy:backups:
  stage: deploy-backups
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - 00-cluster-infra/backups/**/*
  before_script:
    - *kube_setup
  script:
    - echo "💼 Déploiement RBAC Backup et Déploiement CronJob Backup MySQL......"
    - kubectl apply -f 00-cluster-infra/backups/ -n $NAMESPACE_DEFAULT

    - echo "✅ Backup déployé"
    - kubectl get cronjob -n $NAMESPACE_DEFAULT
  environment:
    name: production
