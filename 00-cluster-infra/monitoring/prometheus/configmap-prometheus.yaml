apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    
    scrape_configs:
    - job_name: 'node-exporter'
      static_configs:
      - targets:
        - 192.168.88.190:9100
        - 192.168.88.189:9100
        - 192.168.88.188:9100
    
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
