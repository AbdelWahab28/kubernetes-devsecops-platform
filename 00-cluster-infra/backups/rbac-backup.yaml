---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-backup-sa
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: insi-m2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mysql-backup-role
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: insi-m2
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec", "services", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mysql-backup-binding
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: insi-m2
subjects:
- kind: ServiceAccount
  name: mysql-backup-sa
  namespace: default
roleRef:
  kind: Role
  name: mysql-backup-role
  apiGroup: rbac.authorization.k8s.io

