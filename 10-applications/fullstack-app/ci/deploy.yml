# ============================================================
# 🚀 DEPLOY — Kubernetes (Blue, Green, Canary)
# Deploy frontend et backend séparément selon ce qui a changé
# ============================================================

# ─────────────────────────────────────────
# ANCRE YAML réutilisable pour kubeconfig
# ─────────────────────────────────────────
.kube_setup: &kube_setup
  - mkdir -p /tmp/kube
  - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kube.yaml
  - export KUBECONFIG=/tmp/kube.yaml
  - kubectl get nodes
  - kubectl cluster-info
  - kubectl get ns $NAMESPACE

# ─────────────────────────────────────────
# DEPLOY BLUE — FRONTEND
# ─────────────────────────────────────────
deploy:blue:frontend:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs:
    - job: push:frontend
      optional: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*
  before_script:
    - *kube_setup
  script:
    - echo "🚀 Déploiement stable FRONTEND..."
    - kubectl apply -f k8s/react/ -n $NAMESPACE
    - kubectl set image deployment/react-insi-m2 react=$IMAGE_FRONTEND_COMMIT -n $NAMESPACE
    - kubectl rollout status deployment/react-insi-m2 -n $NAMESPACE --timeout=600s
    - echo "✅ Frontend déployé"
    - kubectl get pods -n $NAMESPACE -l app=react-insi-m2
  environment:
    name: production

# ─────────────────────────────────────────
# DEPLOY BLUE — BACKEND (Laravel + MySQL)
# ─────────────────────────────────────────
deploy:blue:backend:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs:
    - job: push:backend
      optional: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
  before_script:
    - *kube_setup
  script:
    - echo "🚀 Déploiement  Secrets, ConfigMap et MySQL..."
    - kubectl apply -f k8s/laravel/laravel-configmap.yaml -n $NAMESPACE
    - kubectl apply -f k8s/mysql/ -n $NAMESPACE

    - echo "🚀 Déploiement stable BACKEND (Laravel)..."
    - kubectl apply -f k8s/laravel/ -n $NAMESPACE
    - kubectl set image deployment/laravel-insi-m2 laravel=$IMAGE_BACKEND_COMMIT -n $NAMESPACE
    - kubectl rollout status deployment/laravel-insi-m2 -n $NAMESPACE --timeout=600s

    - echo "✅ Backend déployé"
    - kubectl get pods -n $NAMESPACE -l app=laravel-insi-m2
    - kubectl get pvc,pv -n $NAMESPACE
  environment:
    name: production
# ─────────────────────────────────────────
# DEPLOY GREEN — FRONTEND (manuel)
# ─────────────────────────────────────────
deploy:green:frontend:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - *kube_setup
  rules:
    - if: $CI_COMMIT_BRANCH == "green"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - echo "🟢 Déploiement GREEN FRONTEND..."
    - kubectl apply -f ../deployment-strategies/Blue-Green/ -n $NAMESPACE
    - kubectl rollout status deployment/react-insi-m2-green -n $NAMESPACE --timeout=600s

    - echo "⏳ Vérification readiness pods GREEN..."
    - kubectl wait --for=condition=ready pod -l app=react,version=green --timeout=120s -n $NAMESPACE

    - echo "🔍 Vérification que le service pointe vers BLUE..."
    - CURRENT_SELECTOR=$(kubectl get service react-service -n $NAMESPACE -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "none")
    - echo "Selector actuel → $CURRENT_SELECTOR"

    - echo "🔀 Switch du service vers GREEN..."
    - kubectl patch service react-service -n $NAMESPACE -p '{"spec":{"selector":{"app":"react","version":"green"}}}'
    - echo "✅ Trafic basculé vers GREEN frontend"
    - kubectl get pods -n $NAMESPACE -l app=react
  environment:
    name: production

# ─────────────────────────────────────────
# DEPLOY CANARY — FRONTEND (manuel)
# 10% du trafic vers la version canary
# ─────────────────────────────────────────
deploy:canary:frontend:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - *kube_setup
  rules:
    - if: $CI_COMMIT_BRANCH == "canary"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - echo "🟡 Déploiement CANARY FRONTEND (10% trafic)..."
    - kubectl apply -f ../deployment-strategies/Canary/ -n $NAMESPACE
    - kubectl rollout status deployment/react-insi-m2-canary -n $NAMESPACE --timeout=600s
    - echo "✅ Canary déployé — 10% du trafic vers CANARY"
    - kubectl get pods -n $NAMESPACE -l app=react
  environment:
    name: production