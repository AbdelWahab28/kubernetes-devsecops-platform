apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-insi-m2
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: react
      version: blue
  template:
    metadata:
      labels:
        app: react
        version: blue
    spec:
      imagePullSecrets:
      - name: gitlab-registry-secret
      containers:
      - name: react
        image: registry.gitlab.com/projet_insi/app-testcluster/reactapp:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://laravel-service:8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: react-to-laravel
spec:
  podSelector:
    matchLabels:
      app: react
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: laravel
    ports:
    - protocol: TCP
      port: 8080
